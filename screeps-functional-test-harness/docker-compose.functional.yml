services:
  screeps:
    image: node:18-alpine
    ports:
      - "21025:21025"  # Game port
      - "21026:21026"  # CLI port
    environment:
      - NODE_ENV=development
    volumes:
      - ./mock-server:/app
      - ./filebot-mod.js:/app/filebot-mod.js:ro
      - ./test-bot.js:/app/test-bot.js:ro
    working_dir: /app
    command: ["sh", "-c", "apk add --no-cache curl && npm install && node server.js"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:21026/cli"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  screeps_data: