services:
  screeps:
    build:
      context: ./screeps-launcher
      args:
        ARCH: arm64
    image: screepers/screeps-launcher:functional
    volumes:
      - ./functional-test-config.yml:/screeps/config.yml
      - ../functional/filebot-mod.js:/tmp/filebot-mod.js:ro
      - screeps-functional-data:/screeps
    ports:
      - "21025:21025/tcp"
      - "21026:21026/tcp"
    restart: "no"

volumes:
  screeps-functional-data: